# Render Blueprint for the Purchasing price check (price_listener.py).
# Render → New → Blueprint → this repo. Notion webhooks then POST to
# https://per-price-listener.onrender.com/notion/webhook (see the README's Setup).
# Starter plan: a free web service sleeps after 15 minutes without requests, which pauses
# the worker (queued rows wait in the Job Log until it wakes).
services:
  - type: web
    name: per-price-listener
    runtime: python
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python price_listener.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: '3.12.7'
      # Copy these two from PERBot's Render service (Environment tab).
      - key: NOTION_TOKEN
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      # Leave empty on the first deploy; set it to the token the listener logs when you
      # create the Notion webhook subscription.
      - key: NOTION_WEBHOOK_SECRET
        sync: false
      # Web search (DuckDuckGo blocks Render's IPs) and the LLM that reads product pages.
      - key: SERPER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Optional: exact distributor prices; Groq as a second LLM.
      - key: MOUSER_API_KEY
        sync: false
      - key: DIGIKEY_CLIENT_ID
        sync: false
      - key: DIGIKEY_CLIENT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Optional: where alerts go when the Point of contact has no Slack match.
      - key: PRICE_CHECK_CHANNEL
        sync: false
      # Alert thresholds and pacing (README → Settings).
      - key: PRICE_CHECK_THRESHOLD_PCT
        value: '10'
      - key: PRICE_CHECK_MIN_DELTA_USD
        value: '0'
      - key: PRICE_LISTENER_MAX_PER_HOUR
        value: '20'
