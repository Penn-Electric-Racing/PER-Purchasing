name: Purchasing — Price Check Queue

# Price-checks new Purchasing (PEFS) rows, however they were added. Every 30 min:
#   1. queue open, complete rows created in the last week that were never queued
#      ("price-check-queue <page id>" in PERBot's ⚙️ Job Log), then
#   2. check up to PRICE_CHECK_BATCH (default 10) queued rows one at a time, DM the Point of
#      contact when the price moved past PRICE_CHECK_THRESHOLD_PCT, and mark them done.
# PERBot's /parts queues its rows too and sends a repository_dispatch ("price-check") that
# starts a run right away. Runs never overlap (concurrency), and every run drains whatever
# is queued, so it doesn't matter that GitHub keeps only one pending run.
on:
  repository_dispatch:
    types: [price-check]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the alerts to the log instead of sending them (queue left as is)'
        type: boolean
        default: false

jobs:
  price-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: price-check
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check queued rows and DM alerts
        run: python price_check.py --queue -v ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          PRICE_CHECK_THRESHOLD_PCT: ${{ vars.PRICE_CHECK_THRESHOLD_PCT }}
          PRICE_CHECK_MIN_DELTA_USD: ${{ vars.PRICE_CHECK_MIN_DELTA_USD }}
          PRICE_CHECK_CHANNEL: ${{ vars.PRICE_CHECK_CHANNEL }}
          PRICE_CHECK_BATCH: ${{ vars.PRICE_CHECK_BATCH }}
          PRICE_CHECK_LOOKBACK_HOURS: ${{ vars.PRICE_CHECK_LOOKBACK_HOURS }}
          # DuckDuckGo blocks cloud IPs, so set a search key.
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          MOUSER_API_KEY: ${{ secrets.MOUSER_API_KEY }}
          DIGIKEY_CLIENT_ID: ${{ secrets.DIGIKEY_CLIENT_ID }}
          DIGIKEY_CLIENT_SECRET: ${{ secrets.DIGIKEY_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
